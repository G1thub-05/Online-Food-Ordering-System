# Create workflow file
# New-Item .github\workflows\keep-render-awake.yml -ItemType File

# Commit and Push
# git add .github/workflows/keep-render-awake.yml
# git commit -m "Add GitHub Action to keep Render app awake"
# git push origin main

# GitHub
# Actions → Keep Render App Awake → Run workflow → Logs

name: Keep Render App Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render App
        run: |
          echo "Ping Time: $(date)"
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://online-food-ordering-system-y2kf.onrender.com/health)

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" -ne 200 ]; then
            echo "Application is not responding properly."
            exit 1
          fi
